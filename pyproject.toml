[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-video-depth"
version = "0.1.0"
description = "Offline video-to-relative-depth conversion with Depth Anything V2 Small"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=9.5,<13",
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0,<7"]

[project.scripts]
depth-video = "depth_video:main"
depth-video-ui = "depth_ui:main"

[tool.setuptools]
py-modules = ["depth_video", "depth_ui"]

[package]
name = "offline_video_depth"
version = "0.3.0"
description = "A local desktop video depth converter"
authors = ["Offline Video Depth contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "offline_video_depth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
